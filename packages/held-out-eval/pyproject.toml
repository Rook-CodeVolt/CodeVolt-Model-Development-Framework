[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "held-out-eval"
version = "0.1.0"
description = "A standalone, trainer-agnostic, by-construction contamination registry for train/held-out data splits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "CodeVolt"}]
keywords = ["evaluation", "contamination", "held-out", "benchmark", "data-governance", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero runtime dependencies, by design: stdlib only (json, dataclasses,
# pathlib, collections.abc). This is load-bearing for this package's
# entire adoptability claim -- see README.md and this repository's
# docs/decisions/0012-extract-held-out-eval-standalone-package.md.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
held-out-eval = "held_out_eval.cli:main"

[project.urls]
Homepage = "https://github.com/Rook-CodeVolt/CodeVolt-Model-Development-Framework/tree/main/packages/held-out-eval"
Source = "https://github.com/Rook-CodeVolt/CodeVolt-Model-Development-Framework/tree/main/packages/held-out-eval"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
